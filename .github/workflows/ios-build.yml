name: iOS Build (unsigned)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure Icon Composer (icontool) is inside Xcode
        run: |
          DEV_DIR="$(xcode-select -p)"
          XC_APP_DIR="$(dirname "$DEV_DIR")/Applications"
          ICON_APP="$XC_APP_DIR/Icon Composer.app"
          echo "Developer dir: $DEV_DIR"
          if [ ! -d "$ICON_APP" ]; then
            for SRC in "/Applications/Icon Composer.app" "$HOME/Applications/Icon Composer.app"; do
              if [ -d "$SRC" ]; then
                echo "Found standalone Icon Composer at $SRC, copying into Xcode"
                sudo cp -R "$SRC" "$ICON_APP"
                break
              fi
            done
          fi
          if [ ! -d "$ICON_APP" ]; then
            echo "::warning::Icon Composer.app not found; actool .icon build will fail"
            ls /Applications/ || true
            mdfind -name "Icon Composer" || true
          fi
          ls "$ICON_APP/Contents/MacOS/" || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Rust server for iOS
        run: |
          cd kugou_api_server/rust
          ./build_ios.sh

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Diagnose actool/icon build (results in job summary)
        if: failure()
        run: |
          DEV_DIR="$(xcode-select -p)"
          XC_APPS="$(dirname "$DEV_DIR")/Applications"
          {
            echo "## actool diagnostics"
            echo ""
            echo "xcode-select -p: \`$DEV_DIR\`"
            echo ""
            echo "### Xcode Contents/Applications"
            echo '```'
            ls -la "$XC_APPS" 2>&1
            echo '```'
            echo "### /Applications grep icon"
            echo '```'
            ls /Applications 2>/dev/null | grep -i -e icon -e composer || echo "(none)"
            echo '```'
            echo "### mdfind Icon Composer"
            echo '```'
            mdfind -name "Icon Composer" 2>&1 | head -20 || true
            echo '```'
            echo "### which icontool via xcrun"
            echo '```'
            xcrun -f icontool 2>&1 || true
            echo '```'
            echo "### actool test compile of AppIcon.icon"
            echo '```'
            xcrun actool "ios/Runner/AppIcon.icon" \
              --compile /tmp/actool_test \
              --app-icon AppIcon --include-all-app-icons \
              --platform iphoneos --minimum-deployment-target 15.0 \
              --target-device iphone 2>&1 | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package as unsigned ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry ../MD3Music-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: md3music-ios-unsigned
          path: build/ios/MD3Music-unsigned.ipa
